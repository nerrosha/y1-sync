name: Windows engine

on:
  push:
    branches: [main]
    paths: ["Sources/Y1SyncCore/**", "Sources/Y1SyncAPI/**", "Sources/y1sync/**", "windows/scripts/**", "Tests/**", "Package.swift", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: ffmpeg (the engine uses it where the Mac uses AVFoundation)
        run: choco install ffmpeg -y --no-progress
      - name: Swift version
        run: swift --version
      - name: Build the engine and the command-line tool
        run: swift build
      - name: Test
        run: swift test
      - name: Smoke test the JSON commands on real files
        shell: pwsh
        run: ./windows/scripts/smoke.ps1
